<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Metin2 Builder – Build-Rechner &amp; Optimierer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="fx-bg"></canvas>

  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">⚔️</div>
      <div>
        <div class="brand-name">METIN2 BUILDER</div>
        <div class="brand-sub">Build-Rechner &amp; Optimierer</div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="build">Build</button>
      <button class="tab" data-view="inv">Inventar</button>
      <button class="tab" data-view="opt">Optimierer</button>
      <button class="tab" data-view="compare">Vergleich</button>
      <button class="tab" data-view="admin">Admin</button>
    </nav>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <main>
    <section class="view active" id="view-build">
      <div class="layout">
        <div class="col col-left">
          <div class="panel reveal" id="panel-char"></div>
          <div class="panel reveal" id="panel-target"></div>
          <div class="panel reveal" id="panel-buffs"></div>
        </div>
        <div class="col col-mid">
          <div class="panel reveal" id="panel-equip"></div>
          <div class="panel reveal" id="panel-totals"></div>
        </div>
        <div class="col col-right">
          <div class="panel reveal" id="panel-result"></div>
          <div class="panel reveal" id="panel-bottleneck"></div>
          <div class="panel reveal" id="panel-breakdown"></div>
          <div class="panel reveal" id="panel-defense"></div>
        </div>
      </div>
    </section>
    <section class="view" id="view-inv"></section>
    <section class="view" id="view-opt"></section>
    <section class="view" id="view-compare"></section>
    <section class="view" id="view-admin"></section>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div id="toast-root"></div>

  <script src="js/fx.js"></script>
  <script src="js/data-items.js"></script>
  <script src="js/data.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
